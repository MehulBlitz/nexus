name: End-to-end

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: Public GitHub repository used by the critical flow
        required: true
        default: https://github.com/octocat/Hello-World

permissions:
  contents: read

jobs:
  playwright:
    # Keep this pinned: ubuntu-latest can advance to an OS version unsupported by
    # the Playwright release in frontend/package-lock.json.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          APP_SECRET_KEY=ci-only-not-a-real-secret
          DATABASE_URL=postgresql+psycopg://nexus:ci-only-password@db:5432/nexus
          FRONTEND_URL=http://127.0.0.1:5173
          CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
          JOB_EXECUTION_MODE=worker
          MCP_SERVICE_TOKEN=ci-only-not-a-real-token
          POSTGRES_USER=nexus
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=nexus
          EOF
      - name: Start Compose stack
        run: |
          docker compose up -d
          for i in {1..30}; do
            curl --fail http://localhost:8000/api/v1/ready && break
            sleep 5
          done
      - name: Run critical flow
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_REPO_URL: ${{ inputs.repository_url }}
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Stop Compose stack
        if: always()
        run: docker compose --env-file .env down -v
