name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mcp:
    name: MCP server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          APP_SECRET_KEY=ci-only-not-a-real-secret
          DATABASE_URL=postgresql+psycopg://nexus:ci-only-password@db:5432/nexus
          FRONTEND_URL=http://localhost:5173
          CORS_ORIGINS=http://localhost:5173
          JOB_EXECUTION_MODE=worker
          MCP_SERVICE_TOKEN=ci-only-not-a-real-token
          POSTGRES_USER=nexus
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=nexus
          EOF
      - name: Validate compose.yaml
        run: docker compose config --quiet
